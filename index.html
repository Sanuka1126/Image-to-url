<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo to URL - Free Image Link Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
body{background:#0f0f12;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.container{width:100%;max-width:480px;background:#18181c;border:1px solid #2a2a32;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
h1{text-align:center;font-size:26px;margin-bottom:6px;}
p.sub{text-align:center;color:#9aa0a6;font-size:14px;margin-bottom:24px;}
.upload-box{border:2px dashed #3a3a48;border-radius:18px;padding:32px 20px;text-align:center;cursor:pointer;transition:.2s;background:#1e1e26;}
.upload-box:hover{border-color:#7c5cff;background:#23232e;}
.upload-box h3{font-size:16px;margin-bottom:4px;}
.upload-box span{font-size:12px;color:#9aa0a6;}
input[type=file]{display:none;}
.preview{margin-top:20px;display:none;}
.preview img{width:100%;border-radius:14px;max-height:300px;object-fit:contain;background:#000;}
.result{margin-top:20px;display:none;background:#1e1e26;border:1px solid #2a2a32;border-radius:14px;padding:16px;}
.result label{font-size:12px;color:#9aa0a6;display:block;margin-bottom:8px;}
.url-box{display:flex;gap:8px;}
.url-box input{flex:1;background:#121216;border:1px solid #2a2a32;border-radius:10px;padding:12px;color:#7c5cff;font-size:13px;}
.btn{border:none;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;}
.btn-copy{background:#7c5cff;color:#fff;}
.btn-upload{width:100%;margin-top:16px;background:#fff;color:#000;padding:14px;font-size:15px;display:none;}
.loading{display:none;text-align:center;margin-top:20px;color:#9aa0a6;}
.footer{text-align:center;margin-top:18px;font-size:11px;color:#5a5a6a;}
</style>
</head>
<body>
<div class="container">
<h1>📸 Photo to URL</h1>
<p class="sub">Photo එක upload කරලා instant link එකක් ගන්න</p>
<div class="upload-box" id="dropZone">
<div style="font-size:42px;margin-bottom:10px;">☁️</div>
<h3>Click or Drag Photo Here</h3>
<span>JPG, PNG, GIF, WEBP (Max 50MB)</span>
</div>
<input type="file" id="fileInput" accept="image/*">
<div class="preview" id="preview"><img id="previewImg" src=""></div>
<button class="btn btn-upload" id="uploadBtn">🚀 Upload & Get URL</button>
<div class="loading" id="loading">Uploading... Please wait</div>
<div class="result" id="result">
<label>✅ Your Image URL (Copy කරන්න):</label>
<div class="url-box">
<input type="text" id="urlInput" readonly>
<button class="btn btn-copy" id="copyBtn">Copy</button>
</div>
</div>
<div class="footer">Made with ❤️ | Free & No Login Needed</div>
</div>
<script>
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),uploadBtn=document.getElementById('uploadBtn'),loading=document.getElementById('loading'),result=document.getElementById('result'),urlInput=document.getElementById('urlInput');let selectedFile=null;
dropZone.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});
function handleFile(file){selectedFile=file;previewImg.src=URL.createObjectURL(file);preview.style.display='block';uploadBtn.style.display='block';result.style.display='none';}
uploadBtn.addEventListener('click',async()=>{if(!selectedFile)return;uploadBtn.style.display='none';loading.style.display='block';try{const form=new FormData();form.append('reqtype','fileupload');form.append('fileToUpload',selectedFile);const res=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:form});const url=await res.text();if(url.startsWith('https://')){showResult(url.trim());}else{const r=new FileReader();r.onload=e=>showResult(e.target.result);r.readAsDataURL(selectedFile);}}catch(err){const r=new FileReader();r.onload=e=>showResult(e.target.result);r.readAsDataURL(selectedFile);}finally{loading.style.display='none';}});
function showResult(url){urlInput.value=url;result.style.display='block';uploadBtn.style.display='block';uploadBtn.textContent='Upload Another';}
document.getElementById('copyBtn').addEventListener('click',()=>{urlInput.select();document.execCommand('copy');const b=document.getElementById('copyBtn');b.textContent='Copied! ✅';setTimeout(()=>b.textContent='Copy',2000);});
</script>
</body>
  </html>
