<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Image to URL</title><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;background:#000 url('bg.jpg') center/cover no-repeat fixed;position:relative}body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:0}.card{position:relative;z-index:1;width:92%;max-width:420px;background:rgba(15,15,15,.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px;text-align:center}h1{color:#fff;font-size:26px}.sub{color:#aaa;font-size:14px;margin:6px 0 20px}.drop{border:2px dashed rgba(255,255,255,.25);border-radius:14px;padding:30px 15px;cursor:pointer;color:#ddd;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column}#preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;display:none}.result{margin-top:18px;background:rgba(0,0,0,.6);border-radius:10px;padding:14px;display:none;text-align:left}.url-box{display:flex;gap:8px;margin-top:6px}.url-box input{flex:1;background:#111;border:1px solid #333;color:#a78bfa;border-radius:8px;padding:10px;font-size:12px}.btn{background:#fff;color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}.status{margin-top:12px;font-size:13px;word-break:break-all;color:#fbbf24}</style></head><body><div class="card"><h1>Image to URL</h1><p class="sub">සුපරි Url එකක් හදමුද...?🤗</p><div class="drop" id="drop"><span id="dropText">📸 ඔයාට ඕන 4to එක Uplaod කරලා Click කරන්න🥰🌸</span><input type="file" id="file" accept="image/*" hidden><img id="preview"></div><div class="status" id="status"></div><div class="result" id="result"><label style="color:#aaa;font-size:12px">ඔයාගේ Url එකහ්හ්🙃👇</label><div class="url-box"><input id="url" readonly><button class="btn" onclick="copyUrl()">Copy</button></div></div></div><script>
const drop=document.getElementById('drop'),fileInput=document.getElementById('file'),preview=document.getElementById('preview'),dropText=document.getElementById('dropText'),status=document.getElementById('status'),result=document.getElementById('result'),urlInput=document.getElementById('url');
drop.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{if(e.target.files[0])handle(e.target.files[0])});
async function handle(file){
 preview.src=URL.createObjectURL(file);preview.style.display='block';dropText.style.display='none';status.textContent='⏳ Upload වෙනවා😊💞...';status.style.color='#fbbf24';result.style.display='none';
 try{
  let url='';
  // Try 1: tmpfiles.org - 100% CORS support
  try{
    const fd=new FormData();fd.append('file',file);
    const r=await fetch('https://tmpfiles.org/api/v1/upload',{method:'POST',body:fd});
    const j=await r.json();
    if(j.status==='success'){url=j.data.url.replace('tmpfiles.org/dl/','tmpfiles.org/dl/');}
  }catch(e){}
  // Try 2: file.io if first fails
  if(!url){
    const fd2=new FormData();fd2.append('file',file);
    const r2=await fetch('https://file.io',{method:'POST',body:fd2});
    const j2=await r2.json();
    if(j2.success) url=j2.link;
  }
  if(url){urlInput.value=url;result.style.display='block';status.textContent='✅ Hadala! URL eka copy karanna';status.style.color='#4ade80';}
  else throw new Error('Upload fail');
 }catch(e){status.textContent='❌ Error: '+e.message+' - data off karala on karala try karanna';status.style.color='#f87171'}
}
function copyUrl(){navigator.clipboard.writeText(urlInput.value);status.textContent='📋 Copy kala!';}
</script></body></html>
